<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Needle</title>
  <desc id="desc">Needle N and D monogram in a blue violet gradient.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#11172a"/>
      <stop offset=".58" stop-color="#070a12"/>
      <stop offset="1" stop-color="#020307"/>
    </radialGradient>
    <linearGradient id="mark" x1=".14" y1=".05" x2=".8" y2=".96">
      <stop offset="0" stop-color="#8bc8ff"/>
      <stop offset=".35" stop-color="#8a6dff"/>
      <stop offset=".7" stop-color="#6539ff"/>
      <stop offset="1" stop-color="#4520ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
