  <rect x="22" y="22" width="468" height="468" rx="106" fill="url(#background)" stroke="#171c2c" stroke-width="4" filter="url(#shadow)"/>

  <g fill="none" stroke="url(#mark)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M146 337V175l135 137"/>
    <path d="M286 170h40c76 0 119 34 119 86 0 55-41 88-113 88h-26"/>
