name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go code and accounting regressions
        run: |
          go test -race ./...
          go vet ./...
      - name: Check installers and dashboard
        run: |
          sh -n scripts/needle-agent-openwrt.sh
          bash -n scripts/needle-agent.sh
          bash -n scripts/needle-server.sh
          python3 scripts/test-server-installer.py
          python3 scripts/test-release-tools.py
          python3 scripts/test-linux-agent-installer.py
          python3 scripts/test-realtime-config.py
          python3 scripts/test-openwrt-installer.py
          python3 scripts/test-tcpping-selection.py
          python3 scripts/test-agent-upgrade-config.py
          python3 scripts/test-billing-config.py
          node scripts/test-tcpping-dashboard.cjs
          node scripts/test-dashboard-refresh.cjs
          node scripts/test-sparkline-hover.cjs
          node scripts/test-card-billing.cjs
          node scripts/test-realtime-dashboard.cjs
          node scripts/test-renewal-sort.cjs
      - name: Verify real Linux Server migration and CLI permissions
        run: |
          go build -o /tmp/needle-server-security ./cmd/server
          sudo env NEEDLE_DISPOSABLE_SYSTEMD_TEST=1 python3 scripts/test-server-systemd.py /tmp/needle-server-security
      - name: Verify disposable Docker permissions and exposure
        run: |
          docker build -t needle-release-check --build-arg VERSION=ci --build-arg COMMIT="$GITHUB_SHA" .
          bash scripts/test-docker.sh needle-release-check
      - name: Verify real Linux Agent service isolation and lifecycle
        run: |
          CGO_ENABLED=0 go build -o /tmp/needle-agent-security ./cmd/agent
          CGO_ENABLED=0 go test -c -o /tmp/needle-collector-security.test ./internal/agent/collector
          sudo env NEEDLE_DISPOSABLE_SYSTEMD_TEST=1 python3 scripts/test-linux-agent-systemd.py /tmp/needle-agent-security /tmp/needle-collector-security.test

  build:
    needs: installer-check
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('candidate-{0}', github.sha) }}
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install arm64 compiler and execution emulator
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user
      - name: Build Server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: go build -trimpath -ldflags="-s -w -X needle/internal/server.Version=$BUILD_VERSION -X main.BuildCommit=$BUILD_COMMIT" -o release/needle-server ./cmd/server
      - name: Build static Agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w -X main.Version=$BUILD_VERSION -X main.BuildCommit=$BUILD_COMMIT" -o release/needle-agent ./cmd/agent
      - name: Package source-matched artifacts
        env:
          TARGET_ARCH: ${{ matrix.goarch }}
        run: python3 scripts/package-release.py --arch "$TARGET_ARCH" --version "$BUILD_VERSION" --commit "$BUILD_COMMIT" --binaries release --output artifacts
      - name: Execute and verify actual release archives
        env:
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          if [ "$TARGET_ARCH" = arm64 ]; then
            SERVER_RUNNER='qemu-aarch64 -L /usr/aarch64-linux-gnu'
            AGENT_RUNNER='qemu-aarch64'
          else
            SERVER_RUNNER=''
            AGENT_RUNNER=''
          fi
          for archive in artifacts/*.tar.gz; do
            python3 scripts/verify-release.py "$archive" --version "$BUILD_VERSION" --commit "$BUILD_COMMIT" --server-runner "$SERVER_RUNNER" --agent-runner "$AGENT_RUNNER"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goarch }}
          path: artifacts/*

  publish:
    # A manual verification run only uploads Actions artifacts. Publication
    # requires an explicitly pushed tag after all checks and both builds pass.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      - name: Check complete checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd artifacts
          cat checksums-amd64.txt checksums-arm64.txt > checksums.txt
          sha256sum -c checksums.txt
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file ../docs/next-release.md *.tar.gz *.tar.gz.sha256 checksums*.txt
