name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  installer-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go code and accounting regressions
        run: |
          go test -race ./...
          go vet ./...
      - name: Check installers and dashboard
        run: |
          sh -n scripts/needle-agent-openwrt.sh
          bash -n scripts/needle-agent.sh
          python3 scripts/test-linux-agent-installer.py
          python3 scripts/test-realtime-config.py
          python3 scripts/test-openwrt-installer.py
          python3 scripts/test-tcpping-selection.py
          python3 scripts/test-agent-upgrade-config.py
          python3 scripts/test-billing-config.py
          node scripts/test-tcpping-dashboard.cjs
          node scripts/test-dashboard-refresh.cjs
          node scripts/test-sparkline-hover.cjs
          node scripts/test-card-billing.cjs
          node scripts/test-realtime-dashboard.cjs
      - name: Verify real Linux Agent service isolation and lifecycle
        run: |
          CGO_ENABLED=0 go build -o /tmp/needle-agent-security ./cmd/agent
          CGO_ENABLED=0 go test -c -o /tmp/needle-collector-security.test ./internal/agent/collector
          sudo env NEEDLE_DISPOSABLE_SYSTEMD_TEST=1 python3 scripts/test-linux-agent-systemd.py /tmp/needle-agent-security /tmp/needle-collector-security.test

  build:
    needs: installer-check
    strategy:
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross-compiler (arm64)
        if: matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build server
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || '' }}
        run: go build -trimpath -ldflags="-s -w -X needle/internal/server.Version=${{ github.ref_name }}" -o release/needle-server ./cmd/server

      - name: Build agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o release/needle-agent ./cmd/agent

      - name: Package
        run: |
          cd release
          cp ../scripts/needle-server.sh .
          cp ../scripts/needle-agent.sh .
          cp ../agent.yaml.example .
          cp ../scripts/needle-agent-openwrt.sh .
          tar czf ../needle-linux-${{ matrix.goarch }}.tar.gz \
            needle-server needle-agent \
            needle-server.sh needle-agent.sh agent.yaml.example
          tar czf ../needle-agent-linux-${{ matrix.goarch }}.tar.gz \
            needle-agent needle-agent-openwrt.sh agent.yaml.example
          cd ..

      - name: Generate checksums
        run: |
          sha256sum needle-*.tar.gz > checksums-${{ matrix.goarch }}.txt
          for f in needle-*.tar.gz; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            needle-*.tar.gz
            needle-*.tar.gz.sha256
            checksums-${{ matrix.goarch }}.txt

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download per-architecture checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern 'checksums-*.txt'
      - name: Merge checksums
        run: cat checksums-amd64.txt checksums-arm64.txt > checksums.txt
      - name: Upload complete checksum list
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" checksums.txt --repo "${{ github.repository }}" --clobber
