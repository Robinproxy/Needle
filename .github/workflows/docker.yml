name: Docker

on:
  push:
    branches: [main]
    tags: [v*]

env:
  NEEDLE_IMAGE: ghcr.io/robinproxy/needle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check reachable Go vulnerabilities
        run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Verify source and installer regressions
        run: |
          go test -race ./...
          go test -race -run '^TestUnprivilegedLinuxCollectors$' -count=20 ./internal/agent/collector
          go vet ./...
          python3 scripts/test-server-installer.py
          python3 scripts/test-docker-publication.py
      - name: Verify Server migration, CLI permissions and complete lifecycle
        run: |
          go build -o /tmp/needle-server-security ./cmd/server
          sudo env NEEDLE_DISPOSABLE_SYSTEMD_TEST=1 python3 scripts/test-server-systemd.py /tmp/needle-server-security
      - name: Verify Agent collection, sandbox and complete lifecycle
        run: |
          CGO_ENABLED=0 go build -o /tmp/needle-agent-security ./cmd/agent
          CGO_ENABLED=0 go test -c -o /tmp/needle-collector-security.test ./internal/agent/collector
          sudo env NEEDLE_DISPOSABLE_SYSTEMD_TEST=1 python3 scripts/test-linux-agent-systemd.py /tmp/needle-agent-security /tmp/needle-collector-security.test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and verify candidate
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF_TYPE" = "tag" ]; then
            VERSION="$RELEASE_REF_NAME"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "$GITHUB_SHA" | cut -c1-7)
          fi
          docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$GITHUB_SHA" -t needle-candidate .
          bash scripts/test-docker.sh needle-candidate

      - name: Publish candidate or version image
        id: publish
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_REF_TYPE" = "tag" ]; then
            TARGET_TAG="$RELEASE_REF_NAME"
          else
            TARGET_TAG="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          docker tag needle-candidate "$NEEDLE_IMAGE:$TARGET_TAG"
          PUSH_OUTPUT=$(docker push "$NEEDLE_IMAGE:$TARGET_TAG")
          printf '%s\n' "$PUSH_OUTPUT"
          # Bind promotion to this push, independent of local RepoDigests order
          # or repository aliases retained by the Docker image store.
          IMAGE_DIGEST=$(printf '%s\n' "$PUSH_OUTPUT" | awk -v tag="$TARGET_TAG:" '$1 == tag && $2 == "digest:" && $4 == "size:" { print $3 }')
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo 'Cannot determine a unique digest from this push; no image reference exported.' >&2
            exit 1
          fi
          IMAGE_REF="$NEEDLE_IMAGE@$IMAGE_DIGEST"
          printf 'image_ref=%s\n' "$IMAGE_REF" >> "$GITHUB_OUTPUT"

  latest:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    # Only this job writes latest. Retain pending promotions: an older rerun
    # must not displace a newer commit's pending promotion.
    concurrency:
      group: needle-docker-latest
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          # Apply the current promotion policy even when rerunning an old build.
          ref: main
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested digest if commit is still main
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_IMAGE: ${{ needs.build.outputs.image_ref }}
        run: bash scripts/promote-docker-latest.sh "$SOURCE_COMMIT" "$SOURCE_IMAGE"
