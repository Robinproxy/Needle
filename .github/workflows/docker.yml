name: Docker

on:
  push:
    branches: [main]
    tags: [v*]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify source and disposable service lifecycles before publishing
        run: |
          go test -race ./...
          go vet ./...
          python3 scripts/test-server-installer.py
          go build -o /tmp/needle-server-security ./cmd/server
          sudo env NEEDLE_DISPOSABLE_SYSTEMD_TEST=1 python3 scripts/test-server-systemd.py /tmp/needle-server-security
          CGO_ENABLED=0 go build -o /tmp/needle-agent-security ./cmd/agent
          CGO_ENABLED=0 go test -c -o /tmp/needle-collector-security.test ./internal/agent/collector
          sudo env NEEDLE_DISPOSABLE_SYSTEMD_TEST=1 python3 scripts/test-linux-agent-systemd.py /tmp/needle-agent-security /tmp/needle-collector-security.test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$RELEASE_REF_TYPE" = "tag" ]; then
            VERSION="$RELEASE_REF_NAME"
          else
            VERSION=$(git describe --tags --always 2>/dev/null || echo "$GITHUB_SHA" | cut -c1-7)
          fi
          docker build --build-arg VERSION="$VERSION" --build-arg COMMIT="$GITHUB_SHA" -t ghcr.io/robinproxy/needle:latest .
          bash scripts/test-docker.sh ghcr.io/robinproxy/needle:latest
          if [ "$RELEASE_REF_TYPE" = "tag" ]; then
            docker tag ghcr.io/robinproxy/needle:latest "ghcr.io/robinproxy/needle:$RELEASE_REF_NAME"
          fi
          docker push --all-tags ghcr.io/robinproxy/needle
